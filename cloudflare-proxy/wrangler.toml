# Synchronization — Cloudflare Signaling Proxy
# =============================================
# Wrangler configuration for the smart failover proxy Worker.
#
# The Worker intercepts all traffic to sync.synchronizationpro.app
# and automatically routes to the VM (primary) or Render (fallback).
#
# IMPORTANT: In Cloudflare DNS, the A record for "sync" must have
#            the orange cloud (Proxied) enabled — NOT "DNS only".
#            Otherwise Cloudflare can't intercept and the Worker never runs.
#
# Deploy command:
#   cd cloudflare-proxy && npx wrangler deploy

name       = "sync-signal"
main       = "worker.js"
# account_id = "aae21aa244f0d757164432997daaf3f5"  
compatibility_date = "2024-09-23"

# ── Environment variables ─────────────────────────────────────────────────────
# These are readable by the Worker via `env.VM_URL` and `env.RENDER_URL`.
# You can also override them in the Cloudflare dashboard without redeploying.
#
# CRITICAL: VM_URL must be the RAW VM IP address, never the proxy URL.
#           If you set VM_URL to sync.synchronizationpro.app the Worker
#           would health-check itself → infinite loop → total failure.
[vars]
VM_URL     = "http://34.68.33.91:3001"
RENDER_URL = "https://synchronization-807q.onrender.com"

# ── Route binding ─────────────────────────────────────────────────────────────
# This makes the Worker handle ALL requests to sync.synchronizationpro.app.
# Without this, the DNS A record sends traffic directly to the VM, bypassing
# the Worker entirely — and failover never happens.
[[routes]]
pattern    = "sync.synchronizationpro.app/*"
zone_name  = "synchronizationpro.app"
