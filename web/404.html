<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Synchronization Redirect</title>
    <script type="text/javascript">
      // GitHub Pages 404 hack to allow subfolder routing
      // This will take any path like /connect and redirect it to index.html with the right params
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // Redirect to the root index.html
      // We assume the user is deploying the web contents to the root of the domain
      window.location.replace('/' + search + hash);
    </script>
  
  <script>
    (function() {
      var storedSpotlight = localStorage.getItem('bgSpotlightGlow');
      var activeKey = localStorage.getItem('bgActiveKey') || 'procedural_bokeh';
      var spotlightGlow = true;
      if (storedSpotlight === null) {
        if (activeKey === 'purple_snow') spotlightGlow = false;
      } else {
        spotlightGlow = (storedSpotlight !== 'false');
      }
      if (!spotlightGlow) {
        document.documentElement.classList.add('no-spotlight');
      }
    })();
  </script>
</head>

  </body>
</html>
